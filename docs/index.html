<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테트리스</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family: "Noto Sans KR", system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #0f1115;
        color: #f6f7fb;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 960px;
        width: 100%;
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(220px, 280px);
        gap: 24px;
        align-items: start;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      canvas {
        background: #1c212a;
        border-radius: 12px;
        width: 100%;
        height: auto;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
      }

      .panel {
        background: #151820;
        padding: 18px;
        border-radius: 12px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }

      .stats {
        display: grid;
        gap: 12px;
        margin-bottom: 16px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.06);
        padding: 10px 12px;
        border-radius: 10px;
      }

      .stat span {
        display: block;
        font-size: 0.85rem;
        color: #a6adbb;
      }

      .stat strong {
        font-size: 1.4rem;
      }

      button {
        width: 100%;
        padding: 10px 14px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        background: #3c6df0;
        color: #fff;
        cursor: pointer;
        margin-bottom: 8px;
        transition: transform 0.1s ease, background 0.2s ease;
      }

      button.secondary {
        background: #2b303b;
      }

      button:active {
        transform: translateY(1px);
      }

      ul {
        padding-left: 18px;
        margin: 12px 0 0;
        color: #cdd3df;
        line-height: 1.6;
      }

      @media (max-width: 800px) {
        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section>
        <h1>테트리스</h1>
        <canvas id="tetris" width="300" height="600"></canvas>
      </section>
      <aside class="panel">
        <div class="stats">
          <div class="stat">
            <span>점수</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span>레벨</span>
            <strong id="level">1</strong>
          </div>
          <div class="stat">
            <span>라인</span>
            <strong id="lines">0</strong>
          </div>
        </div>
        <button id="start">게임 시작</button>
        <button id="pause" class="secondary">일시정지</button>
        <button id="reset" class="secondary">리셋</button>
        <p>조작 방법</p>
        <ul>
          <li>← →: 좌/우 이동</li>
          <li>↑: 회전</li>
          <li>↓: 빠른 낙하</li>
          <li>스페이스: 즉시 낙하</li>
          <li>P: 일시정지</li>
        </ul>
      </aside>
    </div>

    <script>
      const canvas = document.getElementById("tetris");
      const context = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const levelEl = document.getElementById("level");
      const linesEl = document.getElementById("lines");
      const startBtn = document.getElementById("start");
      const pauseBtn = document.getElementById("pause");
      const resetBtn = document.getElementById("reset");

      const COLS = 10;
      const ROWS = 20;
      const BLOCK = 30;
      const COLORS = [
        "#0f1115",
        "#38bdf8",
        "#f472b6",
        "#fbbf24",
        "#a78bfa",
        "#34d399",
        "#f87171",
        "#facc15",
      ];

      const SHAPES = [
        [],
        [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ],
        [
          [0, 2, 0],
          [2, 2, 2],
          [0, 0, 0],
        ],
        [
          [3, 3, 0],
          [0, 3, 3],
          [0, 0, 0],
        ],
        [
          [0, 4, 4],
          [4, 4, 0],
          [0, 0, 0],
        ],
        [
          [5, 5],
          [5, 5],
        ],
        [
          [0, 6, 0],
          [0, 6, 0],
          [6, 6, 0],
        ],
        [
          [0, 7, 0],
          [0, 7, 0],
          [0, 7, 7],
        ],
      ];

      context.scale(1, 1);

      const createMatrix = (w, h) => Array.from({ length: h }, () => Array(w).fill(0));

      const arena = createMatrix(COLS, ROWS);

      const player = {
        pos: { x: 0, y: 0 },
        matrix: null,
        score: 0,
        lines: 0,
        level: 1,
      };

      let dropCounter = 0;
      let dropInterval = 800;
      let lastTime = 0;
      let isRunning = false;
      let isPaused = false;

      const drawCell = (x, y, value) => {
        context.fillStyle = COLORS[value];
        context.fillRect(x * BLOCK, y * BLOCK, BLOCK - 1, BLOCK - 1);
      };

      const draw = () => {
        context.fillStyle = "#1c212a";
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, { x: 0, y: 0 });
        drawMatrix(player.matrix, player.pos);
      };

      const drawMatrix = (matrix, offset) => {
        matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              drawCell(x + offset.x, y + offset.y, value);
            }
          });
        });
      };

      const collide = (arenaMatrix, playerObj) => {
        const { matrix, pos } = playerObj;
        for (let y = 0; y < matrix.length; y += 1) {
          for (let x = 0; x < matrix[y].length; x += 1) {
            if (matrix[y][x] !== 0 && (arenaMatrix[y + pos.y] && arenaMatrix[y + pos.y][x + pos.x]) !== 0) {
              return true;
            }
          }
        }
        return false;
      };

      const merge = (arenaMatrix, playerObj) => {
        playerObj.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              arenaMatrix[y + playerObj.pos.y][x + playerObj.pos.x] = value;
            }
          });
        });
      };

      const rotate = (matrix, dir) => {
        for (let y = 0; y < matrix.length; y += 1) {
          for (let x = 0; x < y; x += 1) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
          }
        }
        if (dir > 0) {
          matrix.forEach((row) => row.reverse());
        } else {
          matrix.reverse();
        }
      };

      const playerRotate = (dir) => {
        const posX = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
          player.pos.x += offset;
          offset = -(offset + (offset > 0 ? 1 : -1));
          if (offset > player.matrix[0].length) {
            rotate(player.matrix, -dir);
            player.pos.x = posX;
            return;
          }
        }
      };

      const sweep = () => {
        let rowCount = 0;
        outer: for (let y = arena.length - 1; y >= 0; y -= 1) {
          for (let x = 0; x < arena[y].length; x += 1) {
            if (arena[y][x] === 0) {
              continue outer;
            }
          }
          const row = arena.splice(y, 1)[0].fill(0);
          arena.unshift(row);
          y += 1;
          rowCount += 1;
        }

        if (rowCount > 0) {
          const lineScores = [0, 40, 100, 300, 1200];
          player.score += lineScores[rowCount] * player.level;
          player.lines += rowCount;
          player.level = Math.floor(player.lines / 10) + 1;
          dropInterval = Math.max(120, 800 - (player.level - 1) * 60);
        }
      };

      const playerDrop = () => {
        player.pos.y += 1;
        if (collide(arena, player)) {
          player.pos.y -= 1;
          merge(arena, player);
          playerReset();
          sweep();
          updateScore();
        }
        dropCounter = 0;
      };

      const hardDrop = () => {
        while (!collide(arena, player)) {
          player.pos.y += 1;
        }
        player.pos.y -= 1;
        merge(arena, player);
        playerReset();
        sweep();
        updateScore();
        dropCounter = 0;
      };

      const playerMove = (dir) => {
        player.pos.x += dir;
        if (collide(arena, player)) {
          player.pos.x -= dir;
        }
      };

      const playerReset = () => {
        const pieceId = Math.floor(Math.random() * (SHAPES.length - 1)) + 1;
        player.matrix = SHAPES[pieceId].map((row) => row.slice());
        player.pos.y = 0;
        player.pos.x = Math.floor((COLS - player.matrix[0].length) / 2);
        if (collide(arena, player)) {
          arena.forEach((row) => row.fill(0));
          player.score = 0;
          player.lines = 0;
          player.level = 1;
          dropInterval = 800;
          updateScore();
          isRunning = false;
          startBtn.textContent = "게임 시작";
        }
      };

      const updateScore = () => {
        scoreEl.textContent = player.score;
        levelEl.textContent = player.level;
        linesEl.textContent = player.lines;
      };

      const update = (time = 0) => {
        if (!isRunning || isPaused) {
          draw();
          return;
        }

        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
          playerDrop();
        }
        draw();
        requestAnimationFrame(update);
      };

      const startGame = () => {
        if (!isRunning) {
          isRunning = true;
          isPaused = false;
          startBtn.textContent = "다시 시작";
          lastTime = 0;
          playerReset();
          updateScore();
          requestAnimationFrame(update);
        }
      };

      const pauseGame = () => {
        if (!isRunning) {
          return;
        }
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? "재개" : "일시정지";
        if (!isPaused) {
          lastTime = performance.now();
          requestAnimationFrame(update);
        } else {
          draw();
        }
      };

      const resetGame = () => {
        arena.forEach((row) => row.fill(0));
        player.score = 0;
        player.lines = 0;
        player.level = 1;
        dropInterval = 800;
        playerReset();
        updateScore();
        draw();
      };

      document.addEventListener("keydown", (event) => {
        if (!isRunning) {
          return;
        }
        if (event.code === "ArrowLeft") {
          playerMove(-1);
        } else if (event.code === "ArrowRight") {
          playerMove(1);
        } else if (event.code === "ArrowDown") {
          playerDrop();
        } else if (event.code === "ArrowUp") {
          playerRotate(1);
        } else if (event.code === "Space") {
          hardDrop();
        } else if (event.code === "KeyP") {
          pauseGame();
        }
      });

      startBtn.addEventListener("click", startGame);
      pauseBtn.addEventListener("click", pauseGame);
      resetBtn.addEventListener("click", resetGame);

      playerReset();
      updateScore();
      draw();
    </script>
  </body>
</html>
